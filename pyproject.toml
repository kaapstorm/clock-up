[project]
name = "clock-up"
version = "0.1.0"
description = "A minimalist command line utility for time tracking"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Norman Hooper", email = "kaapstorm@gmail.com" },
]
keywords = [
    "time-tracking",
    "timesheet",
    "clock-in",
    "clock-out",
    "cli",
    "productivity",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kaapstorm/clock-up"
Source = "https://github.com/kaapstorm/clock-up"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clock_up"]

[dependency-groups]
dev = [
    "ruff",
    "testsweet",
    "ty",
    "tzdata",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "ANN"]
ignore = [
    "ANN002",  # missing annotation for *args
    "ANN003",  # missing annotation for **kwargs
]

[tool.ruff.lint.flake8-annotations]
ignore-fully-untyped = true

[tool.ruff.format]
quote-style = "single"

[tool.testsweet.discovery]
include_paths = ["src/clock_up/tests"]
